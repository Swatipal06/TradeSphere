<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="100%" height="100%">
  <defs>
    <linearGradient id="tsGradDash" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563EB" />
      <stop offset="50%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>
  </defs>

  <!-- Logo Mark: Modern Sphere with Orbit & Growth Surge -->
  <g transform="translate(10, 6)">
    <!-- Base Sphere -->
    <circle cx="24" cy="24" r="22" fill="url(#tsGradDash)" />
    <!-- Dynamic Orbit Ring -->
    <ellipse cx="24" cy="24" rx="22" ry="9" fill="none" stroke="#FFFFFF" stroke-width="2.5" transform="rotate(-30 24 24)" stroke-dasharray="80 15" opacity="0.95" />
    <!-- Upward Trend Line inside Sphere -->
    <path d="M12 28 L20 22 L27 25 L36 14" fill="none" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Pulse Node at Peak -->
    <circle cx="36" cy="14" r="3.2" fill="#FBBF24" stroke="#FFFFFF" stroke-width="1.5" />
  </g>

  <!-- Wordmark -->
  <text x="68" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="800" letter-spacing="-0.5">
    <tspan fill="#1E293B">Trade</tspan><tspan fill="#2563EB">Sphere</tspan>
  </text>
</svg>